name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/airflow_home
      BQ_PROJECT: local-project
      GCP_PROJECT_ID: local-project
      BQ_DATASET: nba_data
      BQ_DATASET_BRONZE: nba_bronze
      BQ_DATASET_SILVER: nba_silver
      BQ_DATASET_GOLD: nba_gold
      BQ_METADATA_DATASET: nba_metadata
      BQ_LOCATION: US
      DBT_TARGET: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify public repository boundary
        run: python scripts/check_public_boundary.py

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy

      - name: Run Python tests
        run: pytest -q

      - name: Evaluate semantic contract fixtures
        run: python scripts/evaluate_semantics.py --output reports/semantic-layer/evaluation.json

      - name: Upload semantic evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-contract-evaluation
          path: reports/semantic-layer/evaluation.json
          if-no-files-found: warn

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run JS tests
        run: npm run test:tracking

      - name: Parse dbt project
        run: dbt parse --project-dir . --profiles-dir dbt/profiles --target dev

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
