name: nba_warehouse
version: 1.0.0
config-version: 2

profile: nba_warehouse

model-paths: ["dbt/models"]
macro-paths: ["dbt/macros"]
test-paths: ["dbt/tests"]

models:
  nba_warehouse:
    +materialized: view


vars:
  # Mirrors current_season in season.yml (enforced by tests/test_season_rollover.py).
  # Override one build with --vars '{"nba_season": "2025-26"}' for an archive.
  nba_current_season: "2026-27"
