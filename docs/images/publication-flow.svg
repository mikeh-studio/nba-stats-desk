<title id="title">How data moves through NBA Stats Desk</title>
<desc id="desc">Data flow: Statistics from NBA API and additional sources are retained and unified, then used to build candidate facts and website models. Gamebooks corroborate supported statistics during validation. A candidate that passes validation becomes one release for supported Ask and app routes. Injury reports separately inform availability. On validation failure, a previous release may remain available only while still valid.</desc>
