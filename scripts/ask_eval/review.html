<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask · Evidence review</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172f39;background:#f2f5f3;line-height:1.5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select{cursor:pointer}header{background:#123e42;color:#f3fcf8;padding:28px max(24px,4vw)}header small{color:#a7d8c9;letter-spacing:.12em;text-transform:uppercase;font-weight:700}h1{font-size:32px;letter-spacing:-.03em;margin:6px 0}h2{font-size:23px;line-height:1.3;margin:0 0 12px}h3{font-size:16px;margin:0 0 12px}p{margin:8px 0}.intro{max-width:920px;color:#d4e4df}.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px}.stat{padding:12px 18px;background:#ffffff10;border:1px solid #ffffff25;border-radius:10px;min-width:150px}.stat strong{font-size:25px;display:block}.stat span{font-size:12px;color:#c6e1d8}.toolbar{padding:16px 4vw;background:#fff;border-bottom:1px solid #dae1dd;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar label{font-size:12px;font-weight:650}.toolbar input,.toolbar select{display:block;padding:8px;border:1px solid #cad5cf;border-radius:6px;background:#fff}.toolbar input{width:250px}.export{margin-left:auto}button{border:1px solid #a9beb5;border-radius:6px;background:#fff;padding:8px 14px;color:#163f3b}button:hover{background:#e4efea}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e5aa51;outline-offset:2px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1560px;margin:auto}.cases{padding:18px;border-right:1px solid #d4dfd8;max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:0}.case{display:block;text-align:left;width:100%;margin:0 0 8px;border-color:transparent;background:transparent;padding:12px}.case[aria-current=true]{background:#fff;border-color:#92b6a4;box-shadow:0 3px 10px #16352a09}.case b{font-size:13px;display:block}.case small{display:block;color:#677d73}.badge{display:inline-block;font-size:11px;font-weight:750;letter-spacing:.02em;padding:3px 7px;border-radius:20px;background:#e6ede9;color:#456255}.pass{background:#def0e5;color:#1a613f}.fail{background:#fae6df;color:#933b27}.pending{background:#fff0d3;color:#775218}main{padding:28px;min-width:0}.panel{background:#fff;border:1px solid #d8e2dc;border-radius:12px;padding:22px;margin:0 0 18px}.eyebrow{font-size:12px;color:#5a7466;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}.meta{color:#5e7066;font-size:13px;overflow-wrap:anywhere}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.answer{white-space:pre-wrap;font-size:14px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}th,td{padding:10px;border-bottom:1px solid #e4eae6;vertical-align:top;overflow-wrap:anywhere}th{background:#eef4f0;color:#42604f}td:first-child{max-width:260px}code{font:12px ui-monospace,monospace}details{margin-top:14px}summary{cursor:pointer;color:#37634f;font-size:13px}pre{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f4;padding:14px;border-radius:7px;max-height:400px;overflow:auto}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.review-grid label{font-size:13px;display:block}.review-grid input,.review-grid select,textarea{width:100%;padding:10px;border:1px solid #bdcec3;border-radius:6px;background:#fff}textarea{margin:12px 0;height:90px}.notice{border-left:3px solid #c99437;padding-left:12px;color:#715727;font-size:13px}footer{padding:18px;color:#5d7164;font-size:12px}#save-state{color:#44664f;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.cases{position:static;max-height:240px;border-bottom:1px solid #d4dfd8;border-right:0}.pair{grid-template-columns:1fr}main{padding:16px}.toolbar{padding:14px}.export{margin-left:0}.review-grid{grid-template-columns:1fr}h1{font-size:27px}}
</style></head><body>
<header><small>NBA Stats Desk / Ask harness</small><h1>Evidence before confidence.</h1><p class="intro" id="intro">Review the questions, expected results, and actual endpoint answers. The comparison below measures contract behavior with frozen evidence and controlled planning. It does not establish real-model accuracy or production readiness.</p><div class="stats" id="stats"></div><p class="intro" id="run-summary"></p><p class="intro" id="evaluation-notes"></p></header>
<div class="toolbar"><label>Find a case<input id="search" placeholder="Question, case ID, or family" type="search"></label><label>Family<select id="family"><option value="">All families</option></select></label><label>Result<select id="result"><option value="">All results</option><option value="changed">Changed</option><option value="failed">Candidate failures</option><option value="pending">Pending review</option></select></label><button class="export" id="export">Export review decisions</button><span id="save-state" role="status" aria-live="polite"></span></div>
<div class="layout"><nav class="cases" id="cases" aria-label="Evaluation cases"></nav><main id="detail"></main></div>
<script>
const DATA=/*__DATA__*/;
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v===undefined?'Missing':JSON.stringify(v);
const baseline=new Map(DATA.baseline.results.map(r=>[r.id,r])), candidate=new Map(DATA.candidate.results.map(r=>[r.id,r]));
const production=DATA.candidate.source_kind==='production_snapshot';
if(production) $('#intro').textContent='Real NBA players, frozen production evidence, and actual '+DATA.candidate.provider+' / '+DATA.candidate.model+' responses through both endpoint transports. Compare the old and updated Ask code against independently calculated expectations. This is a small local evaluation, not a test of the deployed service.';
if(production){const coverage=DATA.source.snapshot.coverage.map(c=>`${c.phase}: ${c.rows.toLocaleString()} rows through ${c.data_through}`).join(' · ');const records=[...(DATA.baseline.runtime?.model_usage||[]),...(DATA.candidate.runtime?.model_usage||[])];const input=records.reduce((n,r)=>n+(r.usage?.input_tokens||0),0),output=records.reduce((n,r)=>n+(r.usage?.output_tokens||0),0);$('#run-summary').textContent=coverage+` · Model calls: ${DATA.baseline.runtime.model_calls} old / ${DATA.candidate.runtime.model_calls} updated · ${input.toLocaleString()} input + ${output.toLocaleString()} output tokens total. A case passes only when both transports meet all structured expectations; narrative quality still needs review.`;}
$('#evaluation-notes').textContent=DATA.notes?.summary||'';
const KEY='ask-review:'+DATA.candidate.case_sha256+':'+DATA.candidate.source_sha256+':'+DATA.candidate.code_sha256;
let reviews={},selected=DATA.candidate.cases[0].id;
try{reviews=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){$('#save-state').textContent='Local storage unavailable. Export decisions before closing.'}
const reviewed=id=>Boolean(reviews[id]?.reviewer?.trim()&&reviews[id]?.decision&&reviews[id].decision!=='pending');
function counts(){const n=DATA.candidate.cases.filter(c=>reviewed(c.id)).length;$('#stats').innerHTML=`<div class="stat"><strong>${DATA.candidate.total}</strong><span>DISTINCT SCENARIOS</span></div><div class="stat"><strong>${DATA.baseline.passed} / ${DATA.baseline.total}</strong><span>OLD ASK — CASES PASSED</span></div><div class="stat"><strong>${DATA.candidate.passed} / ${DATA.candidate.total}</strong><span>UPDATED ASK — CASES PASSED</span></div><div class="stat"><strong>${n} / ${DATA.candidate.total}</strong><span>HUMAN DECISIONS RECORDED</span></div>`}
for(const f of [...new Set(DATA.candidate.cases.map(c=>c.family))])$('#family').insertAdjacentHTML('beforeend',`<option>${esc(f)}</option>`);
function listing(){const query=$('#search').value.toLowerCase(),family=$('#family').value,filter=$('#result').value;const cases=DATA.candidate.cases.filter(c=>(!family||c.family===family)&&JSON.stringify([c.id,c.family,c.turns.map(t=>t.question)]).toLowerCase().includes(query)&&(!filter||(filter==='changed'&&baseline.get(c.id).passed!==candidate.get(c.id).passed)||(filter==='failed'&&!candidate.get(c.id).passed)||(filter==='pending'&&!reviewed(c.id))));$('#cases').innerHTML=cases.map(c=>`<button class="case" data-case="${esc(c.id)}" aria-current="${selected===c.id}"><small>${esc(c.family)}</small><b>${esc(c.id.replaceAll('_',' '))}</b><span class="badge ${candidate.get(c.id).passed?'pass':'fail'}">${candidate.get(c.id).passed?'Pass':'Fail'}</span> <span class="badge ${reviewed(c.id)?'':'pending'}">${reviewed(c.id)?esc(reviews[c.id].decision):'Review pending'}</span></button>`).join('')||'<p>No matching cases.</p>';$('#cases').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.case;listing();detail()})}
function answer(turn,title){const p=turn.payload;return `<section class="panel"><h3>${title} <span class="badge ${turn.passed?'pass':'fail'}">${turn.passed?'Pass':'Fail'}</span></h3><p class="meta">${esc(p.status||p.research_status||p.study_status||'No common status')} · ${turn.latency_ms} ms · HTTP ${turn.http_status}</p><div class="answer">${esc(p.answer||JSON.stringify(p))}</div>${(p.tables||[]).map(t=>`<h4>${esc(t.title)}</h4><div class="scroll"><table><thead><tr>${t.columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}<details><summary>Model calls and token usage</summary><pre>${esc(JSON.stringify(turn.model_usage||[],null,2))}</pre></details><details><summary>Full response and evidence</summary><pre>${esc(JSON.stringify(p,null,2))}</pre></details></section>`}
function detail(){const c=DATA.candidate.cases.find(c=>c.id===selected),a=baseline.get(c.id),b=candidate.get(c.id),r=reviews[c.id]||{};$('#detail').innerHTML=`<section class="panel"><div class="eyebrow">${esc(c.family)} · ${esc(c.id)}</div><h2>${esc(c.turns[0].question)}</h2><p>${esc(c.oracle_note)}</p><p class="notice">${production?'Production snapshot':'Synthetic statistics'} · ${esc(c.source_variant)} source variant · ${esc(DATA.candidate.provider)} / ${esc(DATA.candidate.model)}. Expected results are a draft oracle pending human approval.</p>${DATA.notes?.cases?.[c.id]?`<p class="notice">Review finding: ${esc(DATA.notes.cases[c.id])}</p>`:''}<details><summary>Run provenance and limitations</summary><pre>${esc(JSON.stringify({baseline:{label:DATA.baseline.label,revision:DATA.baseline.revision,runtime:DATA.baseline.runtime,code_sha256:DATA.baseline.code_sha256},candidate:{label:DATA.candidate.label,revision:DATA.candidate.revision,runtime:DATA.candidate.runtime,code_sha256:DATA.candidate.code_sha256},case_sha256:DATA.candidate.case_sha256,source_sha256:DATA.candidate.source_sha256,limitations:DATA.candidate.limitations},null,2))}</pre></details></section>${c.turns.map((t,i)=>`<section class="panel"><div class="eyebrow">Turn ${i+1}</div><h3>${esc(t.question)}</h3><div class="scroll"><table><thead><tr><th>Structured check</th><th>Expected</th><th>Baseline</th><th>Candidate</th></tr></thead><tbody>${b.modes.json[i].checks.map((ch,j)=>`<tr><td><code>${esc(ch.path)}</code>${ch.absolute_tolerance!==undefined?`<br>±${ch.absolute_tolerance}`:''}</td><td>${esc(fmt(ch.equals))}</td><td class="${a.modes.json[i].checks[j]?.passed?'pass':'fail'}">${esc(fmt(a.modes.json[i].checks[j]?.actual))}</td><td class="${ch.passed?'pass':'fail'}">${esc(fmt(ch.actual))}</td></tr>`).join('')}</tbody></table></div></section><div class="pair">${answer(a.modes.json[i],'Baseline')}${answer(b.modes.json[i],'Candidate')}</div>`).join('')}<section class="panel"><h3>Streaming parity</h3><p>Baseline: <b>${a.parity?'Pass':'Fail'}</b> · Candidate: <b>${b.parity?'Pass':'Fail'}</b>. ${DATA.candidate.parity_mode==='full_payload'?'Final JSON and SSE payloads are compared after removing request identifiers and timings.':'Both transports must independently pass the structured expectations; stochastic prose is not compared byte for byte.'}</p><details><summary>Streaming responses and checks</summary><pre>${esc(JSON.stringify({baseline:a.modes.sse,candidate:b.modes.sse},null,2))}</pre></details></section><section class="panel"><h3>Your review</h3><p class="meta">Approval records your judgment; it does not change automated results. Decisions are saved in this browser and included in the export.</p><div class="review-grid"><label>Reviewer<input id="reviewer" value="${esc(r.reviewer||'')}" placeholder="Your name"></label><label>Decision<select id="decision"><option value="pending">Pending review</option><option value="approved">Approve expectation and result</option><option value="revise">Needs revision</option></select></label></div><label for="notes">Review notes</label><textarea id="notes" placeholder="Identity, scope, calculation, wording, or coverage concerns">${esc(r.notes||'')}</textarea><button id="save">Save decision</button></section><section class="panel"><h3>Frozen source</h3><p class="meta">${esc(DATA.source.description)} ${production?'Both versions receive the same captured facts and published profiles. No live warehouse fallback is enabled.':'Variant mutations are defined in the evaluation fixture adapter and disclosed above.'}</p><details><summary>Inspect all source rows and similarity neighbors</summary><pre>${esc(JSON.stringify(DATA.source,null,2))}</pre></details></section>`;$('#decision').value=r.decision||'pending';$('#save').onclick=()=>{if($('#decision').value!=='pending'&&!$('#reviewer').value.trim()){$('#save-state').textContent='Enter a reviewer name before recording a decision.';$('#reviewer').focus();return}reviews[c.id]={reviewer:$('#reviewer').value.trim(),decision:$('#decision').value,notes:$('#notes').value,reviewed_at:new Date().toISOString()};try{localStorage.setItem(KEY,JSON.stringify(reviews));$('#save-state').textContent='Decision saved locally.'}catch(e){$('#save-state').textContent='Storage unavailable. Export to keep this decision.'}counts();listing()}}
$('#export').onclick=()=>{const payload={schema_version:1,case_sha256:DATA.candidate.case_sha256,source_sha256:DATA.candidate.source_sha256,candidate_code_sha256:DATA.candidate.code_sha256,decisions:reviews};const u=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='ask-review-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
['search','family','result'].forEach(id=>$('#'+id).addEventListener('input',listing));counts();listing();detail();
</script></body></html>
